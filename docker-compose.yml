version: '3.8'

services:
  app:
    container_name: khoa-hoc-american-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        REVALIDATE_TIME: ${REVALIDATE_TIME}
        HN_API_SECRET: ${HN_API_SECRET}
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
