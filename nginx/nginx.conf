# Cấu hình Reverse Proxy Nginx trên aaPanel cho Next.js Standalone
# Áp dụng trong: aaPanel > Website > [Domain] > Config hoặc Reverse Proxy

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 180s;
    proxy_connect_timeout 60s;
}

# Cache static assets của Next.js
location /_next/static {
    proxy_pass http://127.0.0.1:3000;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Cache ảnh public
location /images {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
}
